services:

  php:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile

    volumes:
      - ./src:/var/www/html

    ports:
      - "8082:80"

    depends_on:
      - db_php_relearn

  db_php_relearn:
    image: mysql:8.0
    container_name: db_php_relearn
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: php_study
      MYSQL_USER: php_user
      MYSQL_PASSWORD: php_password

    volumes:
      - db-data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro

    ports:
      - "3308:3306"

volumes:
  db-data:
